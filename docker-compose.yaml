services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-labplan_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labplan}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports published — only the app service (same compose network)
    # talks to it. Coolify does not need this reachable from outside.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Coolify parses these `environment:` entries and lists them in its own
    # UI for you to fill in — no `.env` file needed (and none is read by
    # Coolify's Docker Compose deployments the way a manual `docker compose
    # up --env-file` on a plain VPS would).
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-labplan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-labplan_db}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      SEED_ADMIN_LOGIN: ${SEED_ADMIN_LOGIN:-admin}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      # Never seed the dev-only fixture questions/attachments in production.
      SEED_SAMPLE_DATA: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - attachments:/app/storage/attachments
    # Only exposed on the internal Docker network — no host port mapping.
    # Coolify's own Traefik proxy reaches it over that network directly;
    # bringing your own reverse proxy/port publish here would conflict with
    # Coolify's proxy on 80/443. Assign the domain for this service (with
    # ":3000" if Coolify asks for a port) from the Coolify UI instead.
    expose:
      - "3000"

volumes:
  pgdata:
  attachments:
